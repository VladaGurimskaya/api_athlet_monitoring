openapi: 3.0.3
info:
  title: Спортивная система | API
  version: 1.0.0
  description: |
    Система для регистрации, авторизации и управления ролями пользователей.

servers:
  - url: http://localhost:8000/api/v1

paths:

  /auth/register/athlete:
    post:
      tags: [Auth]
      summary: Регистрация спортсмена
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteRegisterRequest'
      responses:
        '201':
          description: Спортсмен успешно зарегистрирован
          content:
            application/json:
              example:
                message: Registered successfully
        '400':
          description: Невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid athlete data

  /auth/register/invite:
    post:
      tags: [Auth]
      summary: Регистрация по инвайт-коду (для тренеров и врачей)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRegisterRequest'
      responses:
        '201':
          description: Успех
          content:
            application/json:
              example:
                message: Account created successfully
        '400':
          description: Ошибка инвайт-кода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid invite code

  /auth/login:
    post:
      tags: [Auth]
      summary: Авторизация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid email or password

  /auth/create-invite-code:
    post:
      tags: [Auth]
      summary: Создание инвайта для врача или тренера
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreateRequest'
      responses:
        '201':
          description: Инвайт успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreateResponse'
        '400':
          description: Ошибка в данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/get-invite-details:
    post:
      tags: [Auth]
      summary: Информация о приглашении
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteDetailsRequest'
      responses:
        '200':
          description: Информация о приглашении
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteDetailsResponse'
        '400':
          description: Ошибка в данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/get-all-invites:
    get:
      tags: [Auth]
      summary: Все инвайты
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Все инвайты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteAllResponse'
        '400':
          description: Ошибка в данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/cancel-invite:
    post:
      tags: [Auth]
      summary: Отмена инвайта
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCancelRequest'
      responses:
        '200':
          description: Инвайт успешно отменён
          content:
            application/json:
              example:
                message: Инвайт успешно отменён
        '400':
          description: Ошибка в данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Смена пароля пользователя
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
            example:
              old_password: oldPass123
              new_password: newSecurePass456
      responses:
        '200':
          description: Пароль успешно изменён
          content:
            application/json:
              example:
                message: Password changed
        '400':
          description: Неверный текущий пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Incorrect current password

  /auth/athlete-profile:
    post:
      tags: [Auth]
      summary: Профиль спортсмена
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteProfileRequest'
      responses:
        '200':
          description: Профиль спортсмена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteProfileResponse'
        '400':
          description: Невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid athlete data
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/athlete-team:
    post:
      tags: [Auth]
      summary: Команда спортсмена
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteProfileRequest'
      responses:
        '200':
          description: Команда спортсмена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteTeamResponse'
        '400':
          description: Невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid athlete data
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /biometrics:
    post:
      tags: [Biometrics]
      summary: Ввод биометрических данных спортсменом
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiometricInput'
      responses:
        '201':
          description: Данные успешно сохранены
          content:
            application/json:
              example:
                message: Biometric data saved
        '400':
          description: Неверные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid biometric format

  /teams/create:
    post:
      tags: [Teams]
      summary: Создание команды
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '201':
          description: Команда успешно создана
        '400':
          description: Ошибка в данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams:
    get:
      tags: [Teams]
      summary: Список команд
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список команд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /team/athlete-team-status:
    get:
      tags: [Teams]
      summary: Заявка на вступление в команду
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Заявки на вступление в команду
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAthleteStatusResponse'
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/all-athletes:
    get:
      tags: [Teams]
      summary: Список всех спортсменов
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список всех спортсменов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllAthletesResponse'
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/athletes:
    post:
      tags: [Teams]
      summary: Список спортсменов в команде
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '200':
          description: Список спортсменов в команде
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamGetAthletesResponse'
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /team/athlete-remove:
    post:
      tags: [Teams]
      summary: Удаление спортсмена из команды
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteProfileRequest'
      responses:
        '200':
          description: Спортсмен успешно удален из команды
          content:
            application/json:
              example:
                message: Athlete removed from team
        '400':
          description: Невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid athlete data
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '403':
          description: Пользователь не является тренером команды
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/coaches:
    post:
      tags: [Teams]
      summary: Список тренеров в команде
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '200':
          description: Список тренеров в команде
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamGetCoachesResponse'
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/join:
    post:
      tags: [Teams]
      summary: Запрос спортсмена на вступление в команду
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamJoinRequest'
      responses:
        '201':
          description: Заявка отправлена
          content:
            application/json:
              example:
                message: Join request sent
        '400':
          description: Ошибка отправки заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid team ID

  /teams/joins-list:
    get:
      tags: [Teams]
      summary: Список заявок на вступление в команды
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список заявок на вступление в команду
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamJoinsListResponse'
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/joins-list/{team_id}:
    get:
      tags: [Teams]
      summary: Список заявок на вступление в команду
      security:
        - bearerAuth: []
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список заявок на вступление в команду
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamJoinsListResponse'
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized
        '500':
          description: Системная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams/join/{request_id}/approve:
    post:
      tags: [Teams]
      summary: Одобрение заявки на вступление в команду
      security:
        - bearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Заявка одобрена
          content:
            application/json:
              example:
                message: Request approved
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Request not found

  /teams/join/{request_id}/reject:
    post:
      tags: [Teams]
      summary: Отклонение заявки на вступление в команду
      security:
        - bearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Заявка отклонена
          content:
            application/json:
              example:
                message: Request rejected
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Request not found

  /training-plans:
    post:
      tags: [Training]
      summary: Создание тренировочного плана
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingPlanCreate'
      responses:
        '201':
          description: План создан

  /get-training-plans:
    post:
      tags: [Training]
      summary: Список тренировочных планов
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список тренировочных планов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanListResponse'
        '401':
          description: Неавторизованный пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Unauthorized

  /training-plans/{plan_id}/items:
    post:
      tags: [Training]
      summary: Добавление пункта в план
      security:
        - bearerAuth: []
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingPlanItemCreate'
      responses:
        '201':
          description: Пункт добавлен

  /training-plans/{plan_id}/assign:
    post:
      tags: [Training]
      summary: Назначить план спортсменам
      security:
        - bearerAuth: []
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [athlete_ids, start_date]
              properties:
                athlete_ids:
                  type: array
                  items:
                    type: integer
                start_date:
                  type: string
                  format: date
            example:
              athlete_ids: [101, 102, 103]
              start_date: "2025-04-22"
      responses:
        '201':
          description: План назначен спортсменам

  /training-plans/items/{item_id}/override:
    post:
      tags: [Training]
      summary: Изменение пункта плана для конкретного спортсмена
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [athlete_id, custom_value]
              properties:
                athlete_id:
                  type: integer
                custom_value:
                  type: string
                custom_notes:
                  type: string
            example:
              athlete_id: 101
              custom_value: "2:00"
              custom_notes: "Увеличена длительность по состоянию"
      responses:
        '201':
          description: Индивидуальное изменение добавлено

  /training-plans/items/{item_id}:
    delete:
      tags: [Training]
      summary: Удаление пункта плана
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Пункт удалён

components:
  schemas:

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    AthleteRegisterRequest:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
        - middle_name
        - gender
        - date_of_birth
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        gender:
          type: string
          enum: [M, F]
        date_of_birth:
          type: string
          format: date
        phone:
          type: string
      example:
        email: ivanov@mail.ru
        password: strongpass123
        first_name: Ivan
        last_name: Ivanov
        middle_name: Petrovich
        gender: M
        date_of_birth: "2006-05-01"
        phone: "+79000000000"

    InviteRegisterRequest:
      type: object
      required:
        - invite_code
        - email
        - password
        - role
        - first_name
        - last_name
        - middle_name
        - license_number
      properties:
        invite_code:
          type: string
        email:
          type: string
        phone:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [ coach, medical ]
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        license_number:
          type: string
        organization_id:
          type: integer
        sport_type_id:
          type: integer
        specialization:
          type: string
        experience_level:
          type: string
      example:
        invite_code: "TRN-INV-2025"
        email: coach@example.com
        password: MyStrongP@ssword
        first_name: Anna
        last_name: Petrova
        middle_name: Sergeevna

    InviteCreateRequest:
      type: object
      required:
        - email
        - role
        - full_name
        - license_number
        - organization_id
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ coach, medical ]
        full_name:
          type: string
        license_number:
          type: string
        organization_id:
          type: integer
      example:
        email: newcoach@example.com
        role: coach
        full_name: Петров Петр Петрович
        license_number: 1234567890
        organization_id: 1

    InviteCreateResponse:
      type: object
